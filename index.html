<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 95vh;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .led-row { display: flex; gap: 28px; margin-bottom: 32px; }
    .led-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: #aaa; }
    .led { width: 34px; height: 34px; border-radius: 50%; background: #2a2a2a; border: 2px solid #444; transition: all 0.2s; }
    .led.red.on   { background: #ff3b30; border-color: #ff6961; box-shadow: 0 0 18px #ff3b30; }
    .led.green.on { background: #34c759; border-color: #63e683; box-shadow: 0 0 18px #34c759; }
    .led.blue.on  { background: #007aff; border-color: #4da3ff; box-shadow: 0 0 18px #007aff; }

    #micBtn {
      padding: 20px; font-size: 20px; border-radius: 50%; width: 150px; height: 150px;
      background: #FFB500; border: none; font-weight: bold; cursor: pointer; color: #121212;
      box-shadow: 0 0 25px rgba(255, 181, 0, 0.4);
    }
    #micBtn.listening { background: #ff3b30; color: #fff; }

    .input-row { display: flex; gap: 8px; margin-top: 28px; width: 100%; max-width: 340px; }
    #cmdInput {
      flex: 1; padding: 12px; font-size: 16px; border-radius: 8px;
      border: 1px solid #444; background: #1e1e1e; color: #fff;
    }
    #sendBtn {
      padding: 12px 18px; font-size: 16px; font-weight: bold; border-radius: 8px;
      border: none; background: #FFB500; color: #121212; cursor: pointer;
    }

    #status { margin-top: 24px; font-size: 16px; text-align: center; max-width: 90%; white-space: pre-wrap; }
    .error-text { color: #ff6961; }
  </style>
</head>
<body>

  <div class="led-row">
    <div class="led-wrap"><div id="ledRed" class="led red"></div><span>RED</span></div>
    <div class="led-wrap"><div id="ledGreen" class="led green"></div><span>GREEN</span></div>
    <div class="led-wrap"><div id="ledBlue" class="led blue"></div><span>BLUE</span></div>
  </div>

  <button id="micBtn">🎤 PRESS</button>

  <div class="input-row">
    <input id="cmdInput" type="text" placeholder="Tap here & use keyboard mic..." />
    <button id="sendBtn">Send</button>
  </div>

  <div id="status">Ready. Tap PRESS or type/dictate below.</div>

  <script>
    const btn = document.getElementById('micBtn');
    const cmdInput = document.getElementById('cmdInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const ledRed = document.getElementById('ledRed');
    const ledGreen = document.getElementById('ledGreen');
    const ledBlue = document.getElementById('ledBlue');

    function setStatus(msg, isError = false) {
      status.innerText = msg;
      status.className = isError ? 'error-text' : '';
    }

    function sendCommand(text) {
      const cleaned = text.trim();
      if (!cleaned) return;
      setStatus(`Thinking about: "${cleaned}"...`);

      google.script.run
        .withSuccessHandler(res => {
          try {
            const state = JSON.parse(res);
            if (state.error) {
              setStatus(`Backend error: ${state.error}`, true);
              return;
            }
            ledRed.classList.toggle('on', Boolean(state.red));
            ledGreen.classList.toggle('on', Boolean(state.green));
            ledBlue.classList.toggle('on', Boolean(state.blue));
            setStatus(`Current State:\n${res}`);
          } catch (e) {
            setStatus(`Unexpected response:\n${res}`, true);
          }
        })
        .withFailureHandler(err => setStatus(`Script error: ${err.message || err}`, true))
        .processVoiceCommand(cleaned);
    }

    sendBtn.onclick = () => {
      sendCommand(cmdInput.value);
      cmdInput.value = '';
    };

    cmdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendCommand(cmdInput.value);
        cmdInput.value = '';
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      btn.style.display = 'none';
      setStatus("Browser mic blocked—use your keyboard's mic in the box above.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onstart = () => { btn.classList.add('listening'); btn.innerText = "🔴 LISTENING"; setStatus("Listening..."); };
      recognition.onspeechend = () => recognition.stop();
      recognition.onend = () => { btn.classList.remove('listening'); btn.innerText = "🎤 PRESS"; };
      recognition.onerror = (e) => {
        btn.classList.remove('listening');
        btn.innerText = "🎤 PRESS";
        setStatus(`Browser mic blocked (${e.error}).\nUse the text box + keyboard mic instead.`, true);
      };
      recognition.onresult = (e) => sendCommand(e.results[0][0].transcript);
      btn.onclick = () => {
        try { recognition.start(); } catch (err) { setStatus(`Mic error: ${err.message}`, true); }
      };
    }
  </script>
</body>
</html>
