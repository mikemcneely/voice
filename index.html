<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ESP32 RGB Voice Controller</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .orb {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgb(0, 0, 0);
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }
    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.recording {
      background: #dc2626;
      box-shadow: 0 0 0 10px rgba(220, 38, 38, 0.25);
    }
    .text-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 340px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 16px;
      outline: none;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: #334155;
      color: #f8fafc;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      min-height: 24px;
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      max-width: 340px;
    }
  </style>
</head>
<body>

  <div id="orb" class="orb"></div>

  <button id="micBtn" class="mic-btn">TAP TO<br>SPEAK</button>

  <div class="text-row">
    <input id="textInput" type="text" placeholder="Or type a color / effect..." />
    <button id="sendBtn" class="send-btn">Send</button>
  </div>

  <div id="status" class="status">Ready</div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxl636GP8JLucuYb0kZ4c8Z6Du7IcjW2ByxPyIoxTO8pB6wUzfTuLR75oe0UhJwoo_g/exec';

    const orb = document.getElementById('orb');
    const micBtn = document.getElementById('micBtn');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');

    let mediaRecorder = null;
    let audioChunks = [];
    let activeStream = null;
    let autoStopTimer = null;

    // Live orb animation state
    let orbState = { r: 0, g: 0, b: 0, effect: 'solid', speed: 5, startTime: performance.now() };
    let lastFlickerTime = 0;
    let flickerColor = { r: 255, g: 80, b: 0 };

    function setOrbVisual(r, g, b) {
      r = Math.max(0, Math.min(255, Math.round(r)));
      g = Math.max(0, Math.min(255, Math.round(g)));
      b = Math.max(0, Math.min(255, Math.round(b)));
      orb.style.background = `rgb(${r}, ${g}, ${b})`;
      orb.style.boxShadow = `0 0 45px rgba(${r}, ${g}, ${b}, 0.75)`;
    }

    function hsvToRgb(h, s, v) {
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let rf = 0, gf = 0, bf = 0;

      if (h < 60)       { rf = c; gf = x; bf = 0; }
      else if (h < 120) { rf = x; gf = c; bf = 0; }
      else if (h < 180) { rf = 0; gf = c; bf = x; }
      else if (h < 240) { rf = 0; gf = x; bf = c; }
      else if (h < 300) { rf = x; gf = 0; bf = c; }
      else              { rf = c; gf = 0; bf = x; }

      return [(rf + m) * 255, (gf + m) * 255, (bf + m) * 255];
    }

    function animateOrb(now) {
      const elapsedMs = now - orbState.startTime;
      const t = elapsedMs / 1000;
      const spd = orbState.speed / 5; // 1..10 mapped to 0.2x..2.0x
      const { r, g, b, effect } = orbState;

      switch (effect) {
        case 'breathe': {
          const wave = 0.5 - 0.5 * Math.cos(t * 2.0 * spd);
          const scale = 0.10 + 0.90 * wave;
          setOrbVisual(r * scale, g * scale, b * scale);
          break;
        }
        case 'pulse': {
          const cycle = (t * 1.1 * spd) % 1.0;
          let scale = 0.08;
          if (cycle < 0.15) {
            scale = Math.sin((cycle / 0.15) * Math.PI);
          } else if (cycle > 0.22 && cycle < 0.37) {
            scale = 0.7 * Math.sin(((cycle - 0.22) / 0.15) * Math.PI);
          }
          setOrbVisual(r * scale, g * scale, b * scale);
          break;
        }
        case 'fireplace': {
          if (now - lastFlickerTime >= 100 / spd) {
            lastFlickerTime = now;
            const inten = 0.35 + Math.random() * 0.65;
            flickerColor.r = 255 * inten;
            flickerColor.g = (35 + Math.random() * 65) * inten;
            flickerColor.b = 0;
          }
          setOrbVisual(flickerColor.r, flickerColor.g, flickerColor.b);
          break;
        }
        case 'police': {
          const step = Math.floor((elapsedMs * spd) / 120) % 4;
          if (step === 0)      setOrbVisual(255, 0, 0);
          else if (step === 2) setOrbVisual(0, 0, 255);
          else                 setOrbVisual(0, 0, 0);
          break;
        }
        case 'rainbow': {
          const h = (t * 90 * spd) % 360;
          const [rr, gg, bb] = hsvToRgb(h, 1.0, 1.0);
          setOrbVisual(rr, gg, bb);
          break;
        }
        case 'solid':
        default:
          setOrbVisual(r, g, b);
          break;
      }

      requestAnimationFrame(animateOrb);
    }

    function updateOrb(data) {
      if (data.error) {
        statusEl.textContent = 'Error: ' + data.error;
        return;
      }
      const r = data.red ?? 0;
      const g = data.green ?? 0;
      const b = data.blue ?? 0;
      const eff = data.effect || 'solid';
      const spd = Math.max(1, Math.min(10, data.speed || 5));

      orbState = { r, g, b, effect: eff, speed: spd, startTime: performance.now() };
      statusEl.textContent = `RGB(${r}, ${g}, ${b}) • ${eff} (speed ${spd})`;
    }

    async function loadInitialState() {
      try {
        const res = await fetch(SCRIPT_URL + '?action=getState');
        const data = await res.json();
        updateOrb(data);
      } catch (e) {
        statusEl.textContent = 'Ready (offline sync skipped)';
      }
    }

    async function sendPayload(payloadObj) {
      statusEl.textContent = 'Sending to Gemini...';
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payloadObj)
        });
        const data = await res.json();
        updateOrb(data);
      } catch (err) {
        statusEl.textContent = 'Network error: ' + err.message;
      }
    }

    function getSupportedMimeType() {
      const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
      for (const t of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function startRecording() {
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = getSupportedMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(activeStream, { mimeType }) : new MediaRecorder(activeStream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          clearTimeout(autoStopTimer);
          if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
            activeStream = null;
          }
          micBtn.classList.remove('recording');
          micBtn.innerHTML = 'TAP TO<br>SPEAK';

          const finalMime = mediaRecorder.mimeType || mimeType || 'audio/mp4';
          const blob = new Blob(audioChunks, { type: finalMime });

          const reader = new FileReader();
          reader.onloadend = () => {
            const base64Audio = reader.result.split(',')[1];
            sendPayload({ audioBase64: base64Audio, mimeType: finalMime });
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        micBtn.classList.add('recording');
        micBtn.innerHTML = 'TAP TO<br>STOP';
        statusEl.textContent = 'Listening... (tap again to send)';

        autoStopTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
        }, 6000);
      } catch (err) {
        statusEl.textContent = 'Mic error: ' + err.message;
      }
    }

    micBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      } else {
        startRecording();
      }
    });

    function handleTextSubmit() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      sendPayload({ transcript: text });
    }

    sendBtn.addEventListener('click', handleTextSubmit);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleTextSubmit();
    });

    requestAnimationFrame(animateOrb);
    loadInitialState();
  </script>
</body>
</html>
