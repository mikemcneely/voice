<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 RGB Voice Control</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Live Mixed RGB Preview Orb */
    #rgbOrb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: #222;
      border: 2px solid #444;
      margin-bottom: 10px;
      transition: all 0.3s ease;
    }
    #rgbValues {
      font-family: monospace;
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 32px;
    }

    /* One-Tap Voice Button */
    #micBtn {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: none;
      background-color: #FFB500;
      color: #121212;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 181, 0, 0.4);
      transition: all 0.2s ease;
    }
    #micBtn:active {
      background-color: #cc9100;
      transform: scale(0.96);
    }
    #micBtn.listening {
      background-color: #ff3b30;
      color: #ffffff;
      box-shadow: 0 0 30px rgba(255, 59, 48, 0.7);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* Text / Keyboard Dictation Fallback */
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      width: 100%;
      max-width: 340px;
    }
    #cmdInput {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #1e1e1e;
      color: #ffffff;
    }
    #sendBtn {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background-color: #FFB500;
      color: #121212;
      cursor: pointer;
    }

    #status {
      margin-top: 24px;
      font-size: 16px;
      text-align: center;
      max-width: 90%;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .error-text {
      color: #ff6961;
    }
  </style>
</head>
<body>

  <div id="rgbOrb"></div>
  <div id="rgbValues">R: 0 | G: 0 | B: 0</div>

  <button id="micBtn">🎤 PRESS</button>

  <div class="input-row">
    <input id="cmdInput" type="text" placeholder="Or type a color / brightness..." />
    <button id="sendBtn">Send</button>
  </div>

  <div id="status">Loading current state...</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxl636GP8JLucuYb0kZ4c8Z6Du7IcjW2ByxPyIoxTO8pB6wUzfTuLR75oe0UhJwoo_g/exec";

    const btn = document.getElementById('micBtn');
    const cmdInput = document.getElementById('cmdInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const rgbOrb = document.getElementById('rgbOrb');
    const rgbValues = document.getElementById('rgbValues');

    function setStatus(msg, isError = false) {
      status.innerText = msg;
      status.className = isError ? 'error-text' : '';
    }

    function updateRgbUI(state) {
      const r = Number(state.red) || 0;
      const g = Number(state.green) || 0;
      const b = Number(state.blue) || 0;
      const isOff = (r === 0 && g === 0 && b === 0);

      rgbOrb.style.backgroundColor = isOff ? '#222' : `rgb(${r}, ${g}, ${b})`;
      rgbOrb.style.boxShadow = isOff ? 'none' : `0 0 28px rgb(${r}, ${g}, ${b})`;
      rgbValues.innerText = `R: ${r} | G: ${g} | B: ${b}`;
    }

    async function sendCommand(text) {
      const cleaned = text.trim();
      if (!cleaned) return;
      setStatus(`Thinking about: "${cleaned}"...`);

      try {
        // text/plain avoids CORS preflight (OPTIONS) on Google Apps Script
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ transcript: cleaned })
        });

        const state = await response.json();
        if (state.error) {
          setStatus(`Backend error: ${state.error}`, true);
          return;
        }

        updateRgbUI(state);
        setStatus(`Updated:\n${JSON.stringify(state)}`);
      } catch (err) {
        setStatus(`Network error: ${err.message}`, true);
      }
    }

    // Load the current saved LED state when the page opens
    async function loadInitialState() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getState`);
        const state = await response.json();
        updateRgbUI(state);
        setStatus("Tap PRESS to speak.");
      } catch (err) {
        setStatus("Ready. Tap PRESS to speak.");
      }
    }

    sendBtn.onclick = () => {
      sendCommand(cmdInput.value);
      cmdInput.value = '';
    };

    cmdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendCommand(cmdInput.value);
        cmdInput.value = '';
      }
    });

    // Web Speech API (works directly on GitHub Pages HTTPS)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      btn.disabled = true;
      btn.style.opacity = "0.4";
      setStatus("Browser voice not supported—use the text box above.", true);
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        btn.classList.add('listening');
        btn.innerText = "🔴 LISTENING";
        setStatus("Listening...");
      };
      recognition.onspeechend = () => recognition.stop();
      recognition.onend = () => {
        btn.classList.remove('listening');
        btn.innerText = "🎤 PRESS";
      };
      recognition.onerror = (e) => {
        btn.classList.remove('listening');
        btn.innerText = "🎤 PRESS";
        setStatus(`Mic error: ${e.error}`, true);
      };
      recognition.onresult = (e) => {
        sendCommand(e.results[0][0].transcript);
      };

      btn.onclick = () => {
        try {
          recognition.start();
        } catch (err) {
          setStatus(`Could not start mic: ${err.message}`, true);
        }
      };
    }

    loadInitialState();
  </script>
</body>
</html>
